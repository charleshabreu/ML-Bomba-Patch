  el.innerHTML=h+'</table></div><span class=mut>🔓 = janela de transferências aberta (a cada 5 jogos). Pênaltis contam como empate: lance o placar do tempo normal.</span>'}
 else if(tab==='m'){el.innerHTML=`<h2>Brasileiro (Série A)</h2><div class=card><div class=row><input id=bn placeholder="Nome do jogador"><select id=bg>${Object.keys(BR).map(g=>`<option value=${g}>${GN[g]} — ${f(BR[g])}</option>`).join('')}</select></div><div class=row><button class=c data-br=C>Contratar p/ Charles</button><button class=l data-br=L>Contratar p/ Lucas</button></div></div>
  <h2>Jogador fora da lista</h2><div class=card><div class=row><input id=xn placeholder="Nome do jogador"><select id=xg>${Object.keys(GN).map(g=>`<option value=${g}>${GN[g]}</option>`).join('')}</select></div><div class=row><select id=xl>${[...LV].map(l=>`<option value=${l}>Nível ${l}</option>`).join('')}<option value=BR>Brasileiro (Série A)</option></select><input id=xp type=number min=0 inputmode=numeric placeholder="Preço R$ (vazio = tabela)"></div><div class=row><button class=c data-xc=C>Contratar p/ Charles</button><button class=l data-xc=L>Contratar p/ Lucas</button></div><span class=mut>Escolha posição e nível para usar o preço da tabela, ou digite um preço próprio.</span></div>
  <h2>Mercado europeu</h2><div class=row><input id=mq placeholder="Buscar jogador ou clube" value="${esc(F.q)}"><select id=mg><option value="">Posição</option>${Object.keys(GN).map(g=>`<option value=${g} ${F.g===g?'selected':''}>${GN[g]}</option>`).join('')}</select><select id=ml><option value="">Nível</option>${[...LV].map(l=>`<option ${F.l===l?'selected':''}>${l}</option>`).join('')}</select></div><div class=card id=ls></div>`;list()}
 else if(tab==='d'){const fr=P.filter(p=>!S.s.find(s=>s.pid===p.i&&!s.sold)),inp=(i,lg,s)=>`<input class=g type=number min=0 data-dl=${i} data-lg=${lg} data-s=${s} value="${(S.d[i][lg]||[])[s]??''}">`;
 el.innerHTML=`<h2>Nova disputa</h2><div class=card><div class=row><input id=dn list=dl placeholder="Jogador disputado"><datalist id=dl>${fr.map(p=>`<option value="${p.n}">`).join('')}</datalist><button data-nd=1>Abrir disputa</button></div><span class=mut>Ida e volta (1×1): lance o placar do tempo normal de cada jogo. Se o agregado empatar, os pênaltis decidem quem leva o jogador, mas o jogo vale como empate no dinheiro. Cada jogo vale dinheiro e entra nas estatísticas, mas não na temporada.</span></div><h2>Disputas</h2>${(S.d||[]).map((d,i)=>{const r=dres(d),p=d.pid!=null?P[d.pid]:null,tk=p&&S.s.find(s=>s.pid===p.i&&!s.sold);return`<div class=card><div class=pl><div class=i><b>${esc(d.n)}</b><span>${p?'Nível '+p.l+' · '+f(p.pr):'fora da lista de preços'}</span></div><button class="s x" data-dd=${i}>✕</button></div><table><tr><th></th><th>Charles</th><th>Lucas</th></tr><tr><td>Ida</td><td>${inp(i,'a',0)}</td><td>${inp(i,'a',1)}</td></tr><tr><td>Volta</td><td>${inp(i,'b',0)}</td><td>${inp(i,'b',1)}</td></tr><tr><td><b>Agregado</b></td><td><b>${r.ag[0]}</b></td><td><b>${r.ag[1]}</b></td></tr></table>${r.done&&r.ag[0]===r.ag[1]?`<div class=row style="margin-top:8px"><span>Pênaltis — vencedor:</span><select data-pen=${i}><option value="">—</option><option value=C ${d.pen==='C'?'selected':''}>Charles</option><option value=L ${d.pen==='L'?'selected':''}>Lucas</option></select></div>`:''}${r.w?`<p><b>Leva o jogador: ${NM[r.w]}</b></p>${p&&!tk?`<button class="${r.w==='C'?'c':'l'}" data-dw=${i}>Contratar p/ ${NM[r.w]} (${f(p.pr)})</button>`:tk?`<span class=mut>Já contratado por ${NM[tk.w]}.</span>`:''}`:''}</div>`}).join('')||'<div class=card><span class=mut>Nenhuma disputa aberta.</span></div>'}`}
 else if(tab==='e'){el.innerHTML=['C','L'].map(k=>{const all=S.s.filter(s=>s.w===k);return`<h2>${NM[k]} — saldo ${f(bal(k,T))}</h2><div class=card>${all.length?all.map((s,i)=>`<div class=pl style="${s.sold?'opacity:.5':''}"><div class=lv style="background:${LC[s.lv]}">${s.lv==='BR'?'BR':s.lv}</div><div class=i><b>${esc(s.n)}</b><span>${GN[s.g]} · ${f(s.pr)}${s.sold?' · vendido (+'+f(s.pr/2)+')':''}</span></div>${s.sold?'':`<button class="s" data-sell=${S.s.indexOf(s)}>Vender 50%</button>`}<button class="s x" data-del=${S.s.indexOf(s)}>✕</button></div>`).join(''):'<span class=mut>Nenhuma contratação ainda.</span>'}</div>`}).join('')+'<span class=mut>✕ cancela a contratação e devolve o valor integral. “Vender” devolve 50%.</span>'}
 else{el.innerHTML=`<h2>Regras em vigor</h2><div class=card><ul class=r><li><b>Vitória</b> +R$ 100.000 · <b>Empate</b> +R$ 40.000 (os dois) · <b>Derrota</b> R$ 0</li><li><b>Gol marcado</b> +R$ 10.000 (sem limite) · <b>Gol sofrido</b> −R$ 5.000 · <b>Clean sheet</b> +R$ 30.000 (vale p/ os dois no 0×0)</li><li><b>Goleada</b> (3+ gols de diferença): +R$ 60.000 / −R$ 40.000</li><li><b>Sequência vitoriosa</b>: +R$ 80.000 só na 3ª vitória seguida da temporada</li><li><b>Crise</b>: −R$ 50.000 só na 3ª derrota seguida</li><li>Temporada = 10 jogos · janela de transferências a cada 5 jogos · pênaltis = empate</li><li>Venda recupera 50% · sem roubo de jogadores · elenco 11–23 · máx. 5 estrangeiros · máx. 2 jogadores Nível A</li><li>Disputa pelo mesmo jogador: ida e volta (1×1). Se o agregado empatar, os pênaltis decidem quem leva o jogador, mas o jogo vale como empate no dinheiro. Cada jogo da disputa vale dinheiro e entra nas estatísticas, mas não na temporada.</li></ul></div>
  <h2>Preços por nível</h2><div class=card><table><tr><th>Nível</th><th>Atac.</th><th>Meio</th><th>Def.</th><th>Gol.</th></tr>${[...LV].map((l,i)=>`<tr><td><b style="color:${LC[l]}">${l}</b></td>${['FW','MF','DF','GK'].map(g=>`<td>${PR[g][i].toLocaleString('pt-BR')}</td>`).join('')}</tr>`).join('')}</table><p class=mut>Brasileiros (Série A): atacante 1.200.000 · meio 900.000 · defensor 600.000 · goleiro 350.000.</p></div>
  <h2>Backup dos dados</h2><div class=card><span class=mut>Os dados ficam salvos neste navegador. Copie o texto abaixo para guardar ou cole um backup e importe.</span><textarea id=bk></textarea><div class=row><button data-exp=1>Gerar backup</button><button data-imp=1>Importar</button></div></div>`}
 $('#nv').innerHTML=[['p','🏆','Painel'],['j','⚽','Jogos'],['m','🛒','Mercado'],['d','⚔️','Disputas'],['e','👥','Elencos'],['r','📋','Regras']].map(t=>`<button data-t=${t[0]} class="${tab===t[0]?'on':''}"><i>${t[1]}</i>${t[2]}</button>`).join('')}
function list(){const q=F.q.toLowerCase(),o=P.filter(p=>(!F.g||p.g===F.g)&&(!F.l||p.l===F.l)&&(!q||(p.n+p.c).toLowerCase().includes(q))).slice(0,60);
 $('#ls').innerHTML=o.map(p=>{const h=S.s.find(s=>s.pid===p.i&&!s.sold);return`<div class=pl><div class=lv style="background:${LC[p.l]}">${p.l}</div><div class=i><b>${p.n}</b><span>${p.c} · ${p.p} · ${AT[p.g].map((a,i)=>a+' '+p.at[i]).join(' · ')}</span></div><div class=o>${p.o}</div>${h?`<span class=tag>${NM[h.w]}</span>`:`<div style="text-align:right"><div class=p>${f(p.pr)}</div><button class="s c" data-b=${p.i} data-w=C>C</button> <button class="s l" data-b=${p.i} data-w=L>L</button></div>`}</div>`}).join('')||'<span class=mut>Nenhum jogador encontrado.</span>'}
function buy(w,rec){const{T}=calc();if(act(w).filter(s=>s.lv==='A').length>=2&&rec.lv==='A'&&!confirm('Já são 2 jogadores Nível A. Contratar mesmo assim?'))return;
 if(rec.lv!=='BR'&&act(w).filter(s=>s.lv!=='BR').length>=5&&!confirm('Limite de 5 estrangeiros atingido. Contratar mesmo assim?'))return;
 if(bal(w,T)<rec.pr&&!confirm('Saldo insuficiente ('+f(bal(w,T))+'). Contratar mesmo assim?'))return;
 S.s.push(Object.assign({w},rec));save();view()}
document.addEventListener('click',e=>{const d=e.target.closest('[data-t],[data-b],[data-br],[data-xc],[data-sell],[data-del],[data-exp],[data-imp],[data-nd],[data-dd],[data-dw]');if(!d)return;const D=d.dataset;
 if(D.t){tab=D.t;view();scrollTo(0,0)}
 else if(D.b!=null){const p=P[+D.b];buy(D.w,{pid:p.i,n:p.n,g:p.g,lv:p.l,pr:p.pr})}
 else if(D.br){const n=$('#bn').value.trim(),g=$('#bg').value;if(!n)return alert('Digite o nome do jogador.');buy(D.br,{pid:null,n,g,lv:'BR',pr:BR[g]})}
 else if(D.xc){const n=$('#xn').value.trim(),g=$('#xg').value,l=$('#xl').value,v=$('#xp').value.trim();if(!n)return alert('Digite o nome do jogador.');const pr=v!==''?Math.max(0,Math.round(+v)):(l==='BR'?BR[g]:PR[g][LV.indexOf(l)]);if(isNaN(pr))return alert('Preço inválido.');buy(D.xc,{pid:null,n,g,lv:l,pr})}
 else if(D.sell!=null){S.s[+D.sell].sold=true;save();view()}
 else if(D.del!=null){if(confirm('Cancelar esta contratação e devolver o valor?')){S.s.splice(+D.del,1);save();view()}}
 else if(D.nd){const n=$('#dn').value.trim();if(!n)return;const p=P.find(x=>x.n.toLowerCase()===n.toLowerCase());S.d=S.d||[];S.d.push({n:p?p.n:n,pid:p?p.i:null,a:[null,null],b:[null,null],pen:''});save();view()}
 else if(D.dd!=null){if(confirm('Excluir esta disputa?')){S.d.splice(+D.dd,1);save();view()}}
 else if(D.dw!=null){const d=S.d[+D.dw],r=dres(d),p=P[d.pid];if(r.w&&p)buy(r.w,{pid:p.i,n:p.n,g:p.g,lv:p.l,pr:p.pr})}
 else if(D.exp){$('#bk').value=JSON.stringify(S)}
 else if(D.imp){try{const x=JSON.parse($('#bk').value);if(!x.g||!x.s)throw 0;S=Object.assign({adj:{C:0,L:0}},x);save();view();alert('Dados importados.')}catch(_){alert('Backup inválido.')}}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.g!=null){const i=+t.dataset.g;S.g[i]=S.g[i]||[null,null];S.g[i][+t.dataset.s]=t.value===''?null:Math.max(0,parseInt(t.value));for(let k=0;k<i;k++)S.g[k]=S.g[k]||[null,null];save();view()}
 else if(t.dataset.dl!=null){const d=S.d[+t.dataset.dl],g=t.dataset.lg;d[g]=d[g]||[null,null];d[g][+t.dataset.s]=t.value===''?null:Math.max(0,parseInt(t.value));save();view()}
 else if(t.dataset.pen!=null){S.d[+t.dataset.pen].pen=t.value;save();view()}
 else if(t.dataset.adj){S.adj[t.dataset.adj]=+t.value||0;save();view()}
 else if(t.id==='mg'||t.id==='ml'){F.g=$('#mg').value;F.l=$('#ml').value;list()}});
document.addEventListener('input',e=>{if(e.target.id==='mq'){F.q=e.target.value;list()}});
view();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
